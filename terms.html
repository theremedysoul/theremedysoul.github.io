<h1>이용 안내</h1>
<p>YouTube AI Inbox는 소유자가 자신의 계정에서 사용하는 개인용 도구입니다. 타인에게 서비스 가입이나 계정 접근을 제공하지 않습니다.</p>
<p>생성된 AI 요약에는 오류가 있을 수 있습니다. 중요한 사실과 판단은 원본 영상을 확인하세요.</p>
<p>이 앱을 이용하려면 소유자의 Google 계정 승인과 별도의 Gemini API 키가 필요합니다. Google과 GitHub의 서비스 약관도 각 서비스 사용에 적용됩니다.</p>
